[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/kiln"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
kiln-accounts = { path = "crates/kiln-accounts" }
kiln-agent = { path = "crates/kiln-agent" }
kiln-agent-claude = { path = "crates/kiln-agent-claude" }
kiln-chat = { path = "crates/kiln-chat" }
kiln-keymap = { path = "crates/kiln-keymap" }
kiln-project = { path = "crates/kiln-project" }
kiln-settings = { path = "crates/kiln-settings" }
kiln-workspace = { path = "crates/kiln-workspace" }

anyhow = "1.0.104"
async-channel = "2.5.0"
async-process = "2.5.0"
jiff = { version = "0.2.46", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
directories = "6.0.0"
gpui-kit = { version = "=0.10.0", features = ["tree-sitter-languages"] }
ignore = "0.4.34"
log = "0.4.35"
env_logger = "0.11.11"
futures = "0.3.34"
notify = "8.2.2"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_lenient = "0.2.4"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
