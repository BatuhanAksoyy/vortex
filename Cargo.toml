[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/vortex"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "UNLICENSED"
repository = "https://github.com/BatuhanAksoyy/vortex"

[workspace.dependencies]
vortex-accounts = { path = "crates/vortex-accounts" }
vortex-agent = { path = "crates/vortex-agent" }
vortex-agent-claude = { path = "crates/vortex-agent-claude" }
vortex-agent-codex = { path = "crates/vortex-agent-codex" }
vortex-bridge = { path = "crates/vortex-bridge" }
vortex-browser = { path = "crates/vortex-browser" }
vortex-chat = { path = "crates/vortex-chat" }
vortex-devices = { path = "crates/vortex-devices" }
vortex-file-icons = { path = "crates/vortex-file-icons" }
vortex-git = { path = "crates/vortex-git" }
vortex-keymap = { path = "crates/vortex-keymap" }
vortex-project = { path = "crates/vortex-project" }
vortex-services = { path = "crates/vortex-services" }
vortex-settings = { path = "crates/vortex-settings" }
vortex-update = { path = "crates/vortex-update" }
vortex-workspace = { path = "crates/vortex-workspace" }

anyhow = "1.0.104"
async-channel = "2.5.0"
async-process = "2.5.0"
base64 = "0.22.1"
jiff = { version = "0.2.46", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
directories = "6.0.0"
gpui-kit = { version = "=0.10.0", features = ["tree-sitter-languages"] }
ignore = "0.4.34"
jsonc-parser = { version = "0.34.0", features = ["cst"] }
log = "0.4.35"
env_logger = "0.11.11"
futures = "0.3.34"
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev", "macos-shared-device", "windows-native"] }
notify = "8.2.2"
nusb = "0.2.9"
nucleo-matcher = "0.3.1"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_lenient = "0.2.4"
serialport = { version = "4.10.1", default-features = false, features = ["usbportinfo-interface"] }
similar = "2.7.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tempfile = "3"
trash = "5.4.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
excessive_nesting = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
