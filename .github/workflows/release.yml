name: Release

# Pushing a v* tag builds the app for both kinds of Mac and publishes the
# release with its CHANGELOG.md section; nothing is released from a
# developer's machine. Kiln offers the update from the published release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the notes when CHANGELOG.md has none.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag against the version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kiln") | .version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "$GITHUB_REF_NAME is not v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cargo build --release --locked -p kiln --target aarch64-apple-darwin
          cargo build --release --locked -p kiln --target x86_64-apple-darwin
      - name: Bundle
        run: |
          scripts/bundle-macos.sh aarch64-apple-darwin "$VERSION" dist
          scripts/bundle-macos.sh x86_64-apple-darwin "$VERSION" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$VERSION" > notes.md
          [ -s notes.md ] || git log --no-merges --format='- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Kiln $VERSION" --notes-file notes.md
